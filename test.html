<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font-family: sans-serif; margin: 0; padding: 20px; }
  .result { font-size: 24px; font-weight: bold; padding: 20px; margin-top: 20px; border-radius: 8px; }
  .mobile { background: #fee; color: #900; }
  .desktop { background: #efe; color: #060; }

  @media (max-width: 980px) {
    .desktop { display: none; }
  }
  @media (min-width: 981px) {
    .mobile { display: none; }
  }
</style>
</head>
<body>

<h1>Viewport Test</h1>
<p>Current window width: <span id="w"></span>px</p>

<div class="mobile result">MOBILE MODE — width 980px or less</div>
<div class="desktop result">DESKTOP MODE — width 981px or more</div>

<script>
  document.getElementById("w").textContent = window.innerWidth;
</script>

</body>
</html>
