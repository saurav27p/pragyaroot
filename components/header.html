<div class="pr-search-panel" id="searchPanel">
  <div class="pr-search-top">
    <div class="pr-search-input-wrap">
      <input
        type="search"
        class="pr-search-input"
        id="searchInput"
        placeholder="Search this page..."
        autocomplete="off"
        aria-label="Search this page">
    </div>
    <button class="pr-search-close" id="searchClose" type="button" aria-label="Close search">×</button>
  </div>

  <div class="pr-search-meta" id="searchMeta">Start typing to search</div>
  <div class="pr-search-results" id="searchResults"></div>
</div>

<script>
(function(){
  var root = document.documentElement;
  var themeBtn = document.getElementById("themeBtn");
  var themeIcon = document.getElementById("themeIcon");

  function applyTheme(theme){
    var dark = theme === "dark";
    root.classList.toggle("dark", dark);
    themeIcon.innerHTML = dark
      ? '<path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"></path>'
      : '<circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="M4.93 4.93l1.42 1.42"></path><path d="M17.65 17.65l1.42 1.42"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="M4.93 19.07l1.42-1.42"></path><path d="M17.65 6.35l1.42-1.42"></path>';
  }

  var savedTheme = localStorage.getItem("pragyaroot-theme");
  if(savedTheme){
    applyTheme(savedTheme);
  }else{
    applyTheme(
      window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light"
    );
  }

  themeBtn.addEventListener("click",function(){
    var next = root.classList.contains("dark") ? "light" : "dark";
    localStorage.setItem("pragyaroot-theme", next);
    applyTheme(next);
  });

  var menuBtn = document.getElementById("menuBtn");
  var drawer = document.getElementById("mobileDrawer");
  var overlay = document.getElementById("overlay");
  var drawerClose = document.getElementById("drawerClose");

  function openDrawer(){
    drawer.classList.add("open");
    overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeDrawer(){
    drawer.classList.remove("open");
    overlay.classList.remove("open");
    document.body.style.overflow = "";
  }

  menuBtn.addEventListener("click", openDrawer);
  drawerClose.addEventListener("click", closeDrawer);
  overlay.addEventListener("click", closeDrawer);
  drawer.querySelectorAll("a").forEach(function(a){
    a.addEventListener("click", closeDrawer);
  });

  var langBtn = document.getElementById("langBtn");
  var langMenu = document.getElementById("langMenu");

  langBtn.addEventListener("click", function(e){
    e.stopPropagation();
    langMenu.classList.toggle("open");
  });

  langMenu.querySelectorAll(".pr-lang-option").forEach(function(opt){
    opt.addEventListener("click", function(){
      root.lang = this.dataset.lang;
      langMenu.classList.remove("open");
    });
  });

  var searchBtn = document.getElementById("searchBtn");
  var searchPanel = document.getElementById("searchPanel");
  var searchClose = document.getElementById("searchClose");
  var searchInput = document.getElementById("searchInput");
  var searchMeta = document.getElementById("searchMeta");
  var searchResults = document.getElementById("searchResults");

  var searchIndex = [];
  var searchTimer;

  function getSearchableText(el){
    var text = el.innerText || el.textContent || "";
    el.querySelectorAll("[alt],[title],[aria-label]").forEach(function(node){
      text += " " +
        (node.getAttribute("alt") || "") + " " +
        (node.getAttribute("title") || "") + " " +
        (node.getAttribute("aria-label") || "");
    });
    return text.replace(/\s+/g," ").trim();
  }

  function buildSearchIndex(){
    var selectors = [
      ".hero", ".trust-card", ".sh",
      ".subj-real", ".subj-dummy", ".grammar-item",
      ".games-real", ".tools-item", ".contact"
    ];
    searchIndex = [];
    document.querySelectorAll(selectors.join(",")).forEach(function(el){
      var text = getSearchableText(el);
      if(text){
        searchIndex.push({ el:el, text:text });
      }
    });
  }

  function makeExcerpt(text, query){
    var max = 150;
    var lowerText = text.toLowerCase();
    var lowerQuery = query.toLowerCase();
    var index = lowerText.indexOf(lowerQuery);
    if(index === -1){
      return text.slice(0,max) + (text.length > max ? "…" : "");
    }
    var start = Math.max(0, index - 65);
    var end = Math.min(text.length, start + max);
    if(start > 0){
      var s = text.indexOf(" ", start);
      if(s !== -1) start = s;
    }
    var excerpt = text.slice(start, end).trim();
    if(start > 0) excerpt = "…" + excerpt;
    if(end < text.length) excerpt += "…";
    return excerpt;
  }

  function getResultTitle(el){
    var heading = el.querySelector("h1,h2,h3,h4,.sname,.games-real span:first-child");
    if(heading) return heading.textContent.trim();
    return (el.textContent || "Result").replace(/\s+/g," ").trim().slice(0,55);
  }

  function searchSite(query){
    var cleanQuery = query.trim().toLowerCase();
    searchResults.innerHTML = "";
    if(!cleanQuery){
      searchMeta.textContent = "Start typing to search";
      return;
    }
    var matches = searchIndex.filter(function(item){
      return item.text.toLowerCase().indexOf(cleanQuery) !== -1;
    });
    searchMeta.textContent = matches.length + (matches.length === 1 ? " result" : " results");
    if(!matches.length){
      searchResults.innerHTML = '<div class="pr-search-empty">No matching content found.</div>';
      return;
    }
    matches.forEach(function(item){
      var result = document.createElement("div");
      result.className = "pr-search-result";

      var title = document.createElement("div");
      title.className = "pr-search-result-title";
      title.textContent = getResultTitle(item.el);

      var excerpt = document.createElement("div");
      excerpt.className = "pr-search-result-excerpt";
      excerpt.textContent = makeExcerpt(item.text, cleanQuery);

      result.appendChild(title);
      result.appendChild(excerpt);

      result.addEventListener("click", function(){
        closeSearch();
        item.el.scrollIntoView({ behavior:"smooth", block:"center" });
        setTimeout(function(){
          item.el.classList.add("pr-search-highlight");
          setTimeout(function(){
            item.el.classList.remove("pr-search-highlight");
          }, 1400);
        }, 350);
      });

      searchResults.appendChild(result);
    });
  }

  function openSearch(){
    buildSearchIndex();
    searchPanel.classList.add("open");
    setTimeout(function(){ searchInput.focus(); }, 80);
  }

  function closeSearch(){
    searchPanel.classList.remove("open");
    searchInput.value = "";
    searchResults.innerHTML = "";
    searchMeta.textContent = "Start typing to search";
  }

  searchBtn.addEventListener("click", function(e){
    e.stopPropagation();
    if(searchPanel.classList.contains("open")) closeSearch();
    else openSearch();
  });

  searchClose.addEventListener("click", closeSearch);

  searchInput.addEventListener("input", function(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      searchSite(searchInput.value);
    }, 40);
  });

  document.addEventListener("click", function(e){
    if(!langMenu.contains(e.target) && !langBtn.contains(e.target)){
      langMenu.classList.remove("open");
    }
    if(
      searchPanel.classList.contains("open") &&
      !searchPanel.contains(e.target) &&
      !searchBtn.contains(e.target)
    ){
      closeSearch();
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      closeSearch();
      langMenu.classList.remove("open");
      closeDrawer();
    }
  });

})();
</script>
