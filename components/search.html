<div class="search-panel" id="searchPanel" role="dialog" aria-modal="true" aria-label="Search" hidden>
  <div class="search-panel__inner">

    <div class="search-panel__head">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input type="search" class="search-panel__input" id="searchPanelInput" placeholder="Search grammar, notes and solutions..." aria-label="Search PragyaRoot" autocomplete="off" spellcheck="false">
      <button class="search-panel__close" id="searchPanelClose" aria-label="Close search">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>

    <div class="search-panel__body" id="searchPanelResults">
      <div class="search-empty" id="searchEmpty">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <p>Start typing to search across grammar, notes and solutions.</p>
      </div>
    </div>

  </div>
</div>
